[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../scripts/deployments.json" }]
remappings = ["usc-contracts/=lib/usc-contracts/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_testnet = "${CREDITCOIN_TESTNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
