services:
  api:
    build:
      context: ./backend
      args:
        CMD_PATH: ./cmd/api
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        CMD_PATH: ./cmd/worker
    env_file: .env
    environment:
      # Override .env's localhost default — inside the Compose network the
      # api service is reachable by its service name, not localhost.
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DELIVERY_TRACKER_MOCK_ADDRESS: ${NEXT_PUBLIC_DELIVERY_TRACKER_MOCK_ADDRESS}
        NEXT_PUBLIC_CLAIM_VAULT_ADDRESS: ${NEXT_PUBLIC_CLAIM_VAULT_ADDRESS}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_SEPOLIA_RPC_URL}
        NEXT_PUBLIC_CREDITCOIN_RPC_URL: ${NEXT_PUBLIC_CREDITCOIN_RPC_URL}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
